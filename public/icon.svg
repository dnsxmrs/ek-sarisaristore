<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#134e4a"/>
      <stop offset="100%" stop-color="#042f2e"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- App Icon Background with smooth squircle border radius -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>

  <!-- Subtle Inner Border -->
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="#2dd4bf" stroke-width="4" stroke-opacity="0.25"/>

  <!-- Store Roof Awning (Striped Sari-Sari Canopy) -->
  <g filter="url(#shadow)">
    <!-- Main Awning Base -->
    <path d="M96 180 L256 120 L416 180 L392 230 L120 230 Z" fill="url(#goldGrad)"/>
    <!-- Awning Scallops -->
    <path d="M120 230 Q144 250 168 230 Q192 250 216 230 Q240 250 264 230 Q288 250 312 230 Q336 250 360 230 Q384 250 392 230" fill="none" stroke="#b45309" stroke-width="6"/>
  </g>

  <!-- Store Building Body -->
  <rect x="130" y="230" width="252" height="170" rx="12" fill="#0f766e" filter="url(#shadow)"/>
  
  <!-- Store Window Counter -->
  <rect x="156" y="254" width="200" height="96" rx="8" fill="#115e59"/>

  <!-- Barcode Scanner Beam Element -->
  <rect x="176" y="274" width="160" height="4" rx="2" fill="#38bdf8"/>
  <rect x="186" y="288" width="14" height="42" rx="2" fill="#f8fafc"/>
  <rect x="206" y="288" width="6" height="42" rx="2" fill="#f8fafc"/>
  <rect x="218" y="288" width="20" height="42" rx="2" fill="#f8fafc"/>
  <rect x="244" y="288" width="8" height="42" rx="2" fill="#f8fafc"/>
  <rect x="258" y="288" width="16" height="42" rx="2" fill="#f8fafc"/>
  <rect x="280" y="288" width="10" height="42" rx="2" fill="#f8fafc"/>
  <rect x="296" y="288" width="22" height="42" rx="2" fill="#f8fafc"/>

  <!-- Counter Shelf / Table -->
  <rect x="120" y="380" width="272" height="26" rx="8" fill="url(#goldGrad)" filter="url(#shadow)"/>

  <!-- Peso Badge Indicator -->
  <g transform="translate(340, 310)" filter="url(#shadow)">
    <circle cx="40" cy="40" r="38" fill="url(#goldGrad)" stroke="#fff" stroke-width="3"/>
    <text x="40" y="52" font-family="system-ui, -apple-system, sans-serif" font-size="36" font-weight="900" fill="#78350f" text-anchor="middle">₱</text>
  </g>
</svg>
